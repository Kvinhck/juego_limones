```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atrapar Limones</title>

  <link rel="stylesheet" href="limones.css"/>
  <script src="utils.js"></script>
</head>

<body onload="iniciar();">

  <div class="contenedor">

    <header class="encabezado">
      <div class="logo-limon">🍋</div>

      <div>
        <span class="mini-titulo">MINI GAME</span>
        <h1>Atrapar Limones</h1>
        <p>Si del cielo te caen limones...</p>
      </div>
    </header>

    <div class="juego">

      <div class="info-juego">
        <h2>⚡ ¡Atrapa los limones!</h2>
        <span>Autor: Kevin Vera</span>
      </div>

      <div class="marco-canvas">
        <canvas id="areaJuego" width="600" height="400"></canvas>
      </div>

      <div class="panel">

        <div class="estadistica">
          <span class="icono-estadistica">🏆</span>

          <div>
            <small>PUNTAJE</small>
            <strong id="txtPuntaje">0</strong>
          </div>
        </div>

        <div class="separador"></div>

        <div class="estadistica">
          <span class="icono-estadistica">❤️</span>

          <div>
            <small>VIDAS</small>
            <strong id="txtVidas">3</strong>
          </div>
        </div>

      </div>

      <div class="botones">

        <button class="btn btn-izquierda" onclick="moverIzquierda();">
          <span class="btn-icono">◀</span>
          Izquierda
        </button>

        <button class="btn btn-derecha" onclick="moverDerecha();">
          Derecha
          <span class="btn-icono">▶</span>
        </button>

        <button class="btn btn-reiniciar" onclick="reiniciar();">
          <span class="btn-icono">↻</span>
          Reiniciar
        </button>

        <button class="btn btn-personaje" onclick="desaparecerPersonaje();">
          <span class="btn-icono">◉</span>
          Ocultar personaje
        </button>

      </div>

      <p class="ayuda">
        🎮 Usa los controles para moverte y atrapar los limones
      </p>

    </div>

  </div>

  <script src="limones.js"></script>

</body>
</html>
```
