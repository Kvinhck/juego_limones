<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapar Limones | Juego</title>
  <link rel="stylesheet" href="limones.css"/>
  <script src="utils.js"></script>
</head>
<body onload="iniciar();">
  <main class="contenedor">
    <header class="encabezado">
      <div class="insignia">🍋</div>
      <div>
        <p class="eyebrow">MINI GAME</p>
        <h1>Atrapar Limones</h1>
        <p class="subtitulo">Si del cielo te caen limones...</p>
      </div>
    </header>

    <section class="tarjeta-juego">
      <div class="info-superior">
        <h2>¡Atrapa todos los que puedas!</h2>
        <span class="autor">Autor: Kevin Vera</span>
      </div>

      <div class="marco-canvas">
        <canvas id="areaJuego" width="600" height="400"></canvas>
      </div>

      <div class="panel">
        <div class="estadistica">
          <span class="icono">🏆</span>
          <div>
            <span class="etiqueta">Puntaje</span>
            <strong id="txtPuntaje">0</strong>
          </div>
        </div>
        <div class="separador"></div>
        <div class="estadistica">
          <span class="icono">❤️</span>
          <div>
            <span class="etiqueta">Vidas</span>
            <strong id="txtVidas">3</strong>
          </div>
        </div>
      </div>

      <div class="botones">
        <button class="btn btn-mover" onclick="moverIzquierda();">← Izquierda</button>
        <button class="btn btn-mover" onclick="moverDerecha();">Derecha →</button>
        <button class="btn btn-reiniciar" onclick="reiniciar();">↻ Reiniciar</button>
        <button class="btn btn-extra" onclick="desaparecerPersonaje();">👤 Ocultar personaje</button>
      </div>
      <p class="ayuda">Usa los botones para mover al personaje y atrapar los limones.</p>
    </section>
  </main>
  <script src="limones.js"></script>
</body>
</html>
